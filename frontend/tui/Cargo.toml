[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[lib]
name = "shinra_tui"
path = "src/lib.rs"

[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
shinra-engine = { path = "../../engine" }
scene = { path = "../../scene" }
ratatui = "0.29"
ratatui-image = { version = "5" }
crossterm = "0.28"
image = "0.25"
glam = "0.28"
ron = "0.10"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
libc = "0.2"
wgpu = "27"
portable-pty = "0.8"
vt100 = "0.15"

[dev-dependencies]
tempfile = "3"
